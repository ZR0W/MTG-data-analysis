# Configuration for the MTG keyword/color trend pipeline.

paths:
  raw_dir: data/raw
  processed_dir: data/processed

ingest:
  # Scryfall asks for a descriptive User-Agent. Change the contact address if you fork this.
  user_agent: "mtg-data-analysis/0.1 (https://github.com/zr0w/mtg-data-analysis)"
  # Bulk data itself only refreshes daily; never re-download more often than this.
  cache_ttl_hours: 24
  bulk_types:
    - oracle_cards
    - default_cards

# set_type values excluded from "design trend" analysis. The pipeline always materializes
# both the filtered ("paper_only") and unfiltered denominators in color_totals, so this
# list only controls what "paper_only" means.
set_type_exclude:
  - masters
  - memorabilia
  - funny
  - token
  - alchemy
  - minigame
  - promo
  - treasure_chest

# The time axis is Magic sets in release order, not calendar buckets. Each set is one
# period, running from its release date until the next set's release.
#   per_set      -> one period per set (finest grain)
#   rolling_sets -> group `group_size` consecutive sets into one period (noise smoothing)
periods:
  mode: per_set
  group_size: 5
