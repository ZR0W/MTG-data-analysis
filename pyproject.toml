[project]
name = "mtg-analysis"
version = "0.1.0"
description = "Reusable dataset and analysis toolkit for MTG keyword/color design trends"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "ijson>=3.3",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.scripts]
mtg-analysis = "mtg_analysis.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.6",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
